<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 24</title>

    <script>
        var liczba_liter_imienia_star = 5;

        function y1_star(x1_star, x2_star) {
            return 3 * Math.pow(x1_star, liczba_liter_imienia_star / (liczba_liter_imienia_star + 2));
        }

        function y2_star(x1_star, x2_star) {
            var rad_star = x1_star * Math.PI / 180;
            return 2 * Math.cos(rad_star) + 3 * Math.sin(rad_star);
        }

        function y3_star(x1_star, x2_star) {
            return Math.pow(
                Math.pow(x1_star, 5) +
                2 * Math.pow(x2_star, 4) * Math.abs(x1_star - x2_star),
                1 / 3
            );
        }

        function oblicz_star() {
            var x1_star = parseFloat(prompt("Podaj x1:"));
            var x2_star = parseFloat(prompt("Podaj x2:"));
            }

            var rad_star = x1_star * Math.PI / 180;

            var wynik1_star = y1_star(x1_star, x2_star);
            var wynik2_star = y2_star(x1_star, x2_star);
            var wynik3_star = y3_star(x1_star, x2_star);

            document.getElementById("wyniki_star").innerHTML =
                "x1 = " + x1_star + " &nbsp;&nbsp; x2 = " + x2_star + "<br>" +
                "x1 = " + x1_star + " &nbsp;&nbsp; x1 = " + rad_star.toFixed(2) + "<br>" +
                "y1 = " + wynik1_star.toFixed(2) + "<br>" +
                "y2 = " + wynik2_star.toFixed(2) + "<br>" +
                "y3 = " + wynik3_star.toFixed(2);
        }
    </script>
</head>

<body>
    <h2>Obliczenia z użyciem Math</h2>

    <input type="button" value="Wczytaj liczby i oblicz" onclick="oblicz_star()">

    <h3>Wyniki:</h3>

    <div id="wyniki_star" style="background-color: silver; color: blue; border: 1px solid black; width: 300px; padding: 5px; font-size: 12px;">
    </div>
</body>
</html>
