<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 24</title>

    <script>
        var liczba_liter_imienia_star = 5;

        function y1_star(x1_star, x2_star) {
            return 3 * Math.pow(x1_star, liczba_liter_imienia_star / (liczba_liter_imienia_star + 2));
        }

        function y2_star(x1_star, x2_star) {
            var rad_star = x1_star * Math.PI / 180;
            return 2 * Math.cos(rad_star) + 3 * Math.sin(rad_star);
        }

        function y3_star(x1_star, x2_star) {
            return Math.pow(
                Math.pow(x1_star, 5) +
                2 * Math.pow(x2_star, 4) * Math.abs(x1_star - x2_star),
                1 / 3
            );
        }

        function oblicz_star() {
            var x1_star = parseFloat(prompt("Podaj x1:"));
            var x2_star = parseFloat(prompt("Podaj x2:"));

            if (!isFinite(x1_star) || !isFinite(x2_star)) {
                alert("Podaj poprawne liczby!");
                return;
            }

            var rad_star = x1_star * Math.PI / 180;

            document.getElementById("x1_star").value = x1_star;
            document.getElementById("x2_star").value = x2_star;
            document.getElementById("rad_star").value = rad_star.toFixed(2);

            document.getElementById("wynik_y1").value = y1_star(x1_star, x2_star).toFixed(2);
            document.getElementById("wynik_y2").value = y2_star(x1_star, x2_star).toFixed(2);
            document.getElementById("wynik_y3").value = y3_star(x1_star, x2_star).toFixed(2);
        }
    </script>
</head>

<body>
    <h2>Obliczenia z użyciem Math</h2>

    <input type="button" value="Wczytaj liczby i oblicz" onclick="oblicz_star()">

    <h3>Wczytane liczby:</h3>

    x1:
    <input type="text" id="x1_star" readonly><br><br>

    x2:
    <input type="text" id="x2_star" readonly><br><br>

    x1 w radianach:
    <input type="text" id="rad_star" readonly><br><br>

    <h3>Wyniki:</h3>

    y1:
    <input type="text" id="wynik_y1" readonly><br><br>

    y2:
    <input type="text" id="wynik_y2" readonly><br><br>

    y3:
    <input type="text" id="wynik_y3" readonly><br><br>
</body>
</html>
