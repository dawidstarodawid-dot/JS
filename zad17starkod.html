<!DOCTYPE html>

<h1>Zadanie 17 - Teoria JavaScript</h1>

<h2>1. Cztery sposoby wyprowadzania danych w JS</h2>
<ol>
    <li>document.write() - wyświetla dane na stronie.</li>
    <li>alert() - wyświetla komunikat w okienku.</li>
    <li>Do okienek formularza - np. input.</li>
    <li>Do tabeli HTML - w komórkach tabeli.</li>
</ol>

<h2>2. Czym jest funkcja w JS?</h2>
<ol>
    <li>Jest zbiorem zgrupowanych instrukcji uruchamianych przez nazwę.</li>
    <li>Po wywołaniu wykonuje swój wewnętrzny kod.</li>
    <li>Może przyjmować argumenty, np. suma(a, b).</li>
    <li>Może zwracać wartość za pomocą return.</li>
</ol>

<h2>3. Metody obiektu document</h2>
<table border="1">
    <tr>
        <th>Metoda</th>
        <th>Opis</th>
    </tr>
    <tr>
        <td>getElementsByName("nazwa")</td>
        <td>Pobiera elementy o określonym atrybucie name.</td>
    </tr>
    <tr>
        <td>getElementById("id")</td>
        <td>Pobiera element o określonym id.</td>
    </tr>
    <tr>
        <td>getElementsByTagName("znacznik")</td>
        <td>Pobiera elementy o określonym znaczniku.</td>
    </tr>
</table>

<h2>4. Właściwości elementów</h2>

<p><b>innerHTML</b> - umożliwia odczyt i zmianę kodu HTML elementu.</p>

<p><b>innerText</b> - umożliwia odczyt i zmianę tekstu elementu.</p>

<p><b>className</b> - umożliwia odczyt i zmianę klasy CSS elementu.</p>

</body>
