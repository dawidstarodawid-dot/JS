<h2>Zadanie 17 - JavaScript</h2>

<p><b>1. Wymień cztery sposoby wyprowadzania danych w JS.</b></p>

<p><u>Odpowiedź:</u></p>

<ol>
    <li>Za pomocą document.write() – wyświetla dane na stronie.</li>
    <li>Za pomocą alert() – wyświetla komunikat w okienku.</li>
    <li>Do okienek formularza – wyświetla dane w polach formularza.</li>
    <li>Do tabeli – wyświetla dane w komórkach tabeli HTML.</li>
</ol>

<p><b>2. Czym jest funkcja w JS? Omów przy użyciu 4 podpunktów.</b></p>

<p><u>Odpowiedź:</u></p>

<ol>
    <li>Funkcja jest zbiorem zgrupowanych instrukcji, które można uruchomić poprzez podanie jej nazwy.</li>
    <li>Po wywołaniu funkcja wykonuje zapisany w niej kod.</li>
    <li>Funkcja może przyjmować argumenty, które są przetwarzane wewnątrz funkcji, np. suma(a, b).</li>
    <li>Funkcja może zwracać obliczoną wartość za pomocą słowa kluczowego return.</li>
</ol>

<p><b>3. Omów metody getElementsByName, getElementById, getElementsByTagName.</b></p>

<p><u>Odpowiedź:</u></p>

<table border="1">
    <tr>
        <th>Metoda</th>
        <th>Opis</th>
    </tr>
    <tr>
        <td>getElementsByName("nazwa")</td>
        <td>Pobiera elementy o określonej wartości atrybutu name.</td>
    </tr>
    <tr>
        <td>getElementById("id")</td>
        <td>Pobiera element o określonej wartości atrybutu id.</td>
    </tr>
    <tr>
        <td>getElementsByTagName("znacznik")</td>
        <td>Pobiera elementy o określonym typie znacznika, np. P lub DIV.</td>
    </tr>
</table>

<p><b>4. Omów właściwości innerHTML, innerText, className.</b></p>

<p><u>Odpowiedź:</u></p>

<p><b>innerHTML</b> – umożliwia odczytywanie, zmienianie, wstawianie lub usuwanie kodu HTML wewnątrz elementu.</p>

<p><b>innerText</b> – umożliwia odczytywanie lub ustawianie tekstu wewnątrz elementu.</p>

<p><b>className</b> – umożliwia odczytywanie lub ustawianie nazwy klasy CSS elementu.</p>
