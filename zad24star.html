<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 24</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: blue;
            font-size: 18px;
        }
    </style>
</head>
<body>

<script>

    let x1_star = parseFloat(prompt("Podaj pierwszą liczbę (x1 - w stopniach):"));
    let x2_star = parseFloat(prompt("Podaj drugą liczbę (x2):"));

    document.write("x1 = " + x1_star + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x2 = " + x2_star + "<br>");

    let rad_star = (x1_star * Math.PI) / 180;

    document.write("x1 = " + x1_star + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x1 = " + rad_star.toFixed(2) + "<br>");


    let liczba_liter_imienia_star = 5; 
    let wykladnik_star = liczba_liter_imienia_star / (liczba_liter_imienia_star + 2);
    let y1_star = 3 * Math.pow(x1_star, wykladnik_star);
    document.write("y1 = " + y1_star.toFixed(2) + "<br>");

    let y2_star = 2 * Math.cos(rad_star) + 3 * Math.sin(rad_star);
    document.write("y2 = " + y2_star.toFixed(2) + "<br>");

    let pod_pierwiastkiem_star = Math.pow(x1_star, 5) + 2 * Math.pow(x2_star, 4);
    let y3_star = Math.cbrt(pod_pierwiastkiem_star) * Math.abs(x1_star - x2_star);
    document.write("y3 = " + y3_star.toFixed(2) + "<br>");
</script>

</body>
</html>
